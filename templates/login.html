<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Group Theater</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theater.css') }}" />
</head>
<body class="page-landing">
  <div class="ambient" aria-hidden="true"></div>
  <main class="landing account-panel">
    <p class="eyebrow">Welcome back</p>
    <h1 class="brand account-brand">Sign in</h1>
    {% with messages = get_flashed_messages() %}{% if messages %}<ul class="flash" role="alert">{% for message in messages %}<li>{{ message }}</li>{% endfor %}</ul>{% endif %}{% endwith %}
    <form method="post" class="account-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
      <label>Email<input type="email" name="email" autocomplete="email" required /></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required /></label>
      <button class="btn btn-gold btn-lg" type="submit">Sign in</button>
    </form>
    <p class="account-switch">New here? <a href="{{ url_for('register') }}">Create an account</a></p>
  </main>
</body>
</html>
